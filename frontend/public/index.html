<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FAFAFD" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("theme");
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia("(prefers-color-scheme: dark)").matches
                              ? "dark"
                              : "light";
                    if (theme === "dark") {
                        document.documentElement.classList.add("dark");
                    }
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) {
                        meta.setAttribute("content", theme === "dark" ? "#0C0C16" : "#FAFAFD");
                    }
                } catch (e) {}
            })();
        </script>
        <meta
            name="description"
            content="Portfolio de Koné Cheick Ismael Thierry — étudiant en Génie Logiciel, administration ITSM (GLPI), Docker, développement PHP et sécurisation SSO."
        />
        <meta name="author" content="Koné Cheick Ismael Thierry" />

        <!-- Aperçu lors du partage du lien -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Koné Cheick Ismael Thierry — Génie Logiciel & Administration ITSM"
        />
        <meta
            property="og:description"
            content="Migration GLPI 10 → 11 pour un groupe présent dans 14 pays, 4 plugins métier en PHP, conteneurisation Docker et authentification unique Microsoft."
        />
        <meta property="og:image" content="%PUBLIC_URL%/images/moi.jpg" />
        <meta name="twitter:card" content="summary_large_image" />

        <title>
            Koné Cheick Ismael Thierry — Génie Logiciel & Administration ITSM
        </title>
    </head>

</html>
